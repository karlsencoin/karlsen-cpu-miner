name: Release

on:
  push:
    tags: ["v*"]
  # Re-run packaging for an existing tag from the Actions tab ("Run workflow").
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-22.04
            asset: linux-x64
          - os: macos-latest
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="karlsen-cpu-miner-${tag}-${{ matrix.asset }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/karlsen-cpu-miner.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/release/karlsen-cpu-miner "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            karlsen-cpu-miner-*.zip
            karlsen-cpu-miner-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum karlsen-cpu-miner-*.zip karlsen-cpu-miner-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: karlsen-cpu-miner ${{ inputs.tag || github.ref_name }}
          files: |
            karlsen-cpu-miner-*.zip
            karlsen-cpu-miner-*.tar.gz
            SHA256SUMS
