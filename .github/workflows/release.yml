name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-22.04
            asset: linux-x64
          - os: macos-latest
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          name="karlsen-cpu-miner-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/karlsen-cpu-miner.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/release/karlsen-cpu-miner "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: karlsen-cpu-miner-*.*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum karlsen-cpu-miner-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: karlsen-cpu-miner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            karlsen-cpu-miner-*
            SHA256SUMS
